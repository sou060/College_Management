spring.application.name=college-management-system

# Database credentials are supplied by the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# Schema changes are versioned in db/migration; Hibernate only checks mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}

# A single bootstrap administrator is configured out-of-band. Replace this
# with the institution's identity provider/user store before multi-user rollout.
app.security.admin-username=${APP_ADMIN_USERNAME}
app.security.admin-password=${APP_ADMIN_PASSWORD}

app.security.cookie-secure=${SESSION_COOKIE_SECURE:true}
app.security.jwt.issuer=${JWT_ISSUER:college-management-system}
app.security.jwt.audience=${JWT_AUDIENCE:college-management-api}
app.security.jwt.secret-base64=${JWT_SIGNING_SECRET_BASE64}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT5M}
app.security.refresh-token.idle-ttl=${JWT_REFRESH_TOKEN_IDLE_TTL:P7D}
app.security.refresh-token.max-ttl=${JWT_REFRESH_TOKEN_MAX_TTL:P30D}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=20m
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
info.app.name=College Management System
info.app.description=College management application

spring.data.web.pageable.max-page-size=100
